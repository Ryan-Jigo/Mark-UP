version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
    volumes:
      # Mount the data directory to persist outputs and read data.xlsx
      - ./backend/data:/workspace/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      # Maps port 80 inside the container (Nginx) to port 80 on the host
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
